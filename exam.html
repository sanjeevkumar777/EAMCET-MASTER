let current = 0;
let userAnswers = new Array(questions.length).fill(null);

// ====== SHOW QUESTION ======
function showQuestion(){
  document.getElementById('qNo').innerText = current+1;
  document.getElementById('question').innerHTML = "<h2>"+questions[current].q+"</h2>";
  
  const opts = questions[current].options.map((opt,i)=>`<div class="option" onclick="selectOption(${i})" id="opt${i}">${opt}</div>`).join('');
  document.getElementById('options').innerHTML = opts;

  if(userAnswers[current] != null) document.getElementById('opt'+userAnswers[current]).classList.add('selected');
  document.getElementById('progress').style.width = ((current)/questions.length*100)+"%";
}

// ====== SELECT OPTION ======
function selectOption(i){
  userAnswers[current] = i;
  for(let j=0;j<4;j++) document.getElementById('opt'+j).classList.remove('selected');
  document.getElementById('opt'+i).classList.add('selected');
}

// ====== NAVIGATION ======
function nextQuestion(){ if(current<questions.length-1){ current++; showQuestion(); } }
function prevQuestion(){ if(current>0){ current--; showQuestion(); } }

// ====== SUBMIT TEST ======
function submitTest(){
  let score = 0;
  for(let i=0; i<questions.length; i++) if(userAnswers[i] === questions[i].answer) score++;
  localStorage.setItem("score", score);
  localStorage.setItem("total", questions.length);
  window.location.href = "result.html";
}

// ====== TIMER ======
let time = 10800; // 3 hours
setInterval(()=>{
  if(time <= 0){ submitTest(); return; }
  time--;
  let h = Math.floor(time/3600);
  let m = Math.floor((time%3600)/60);
  let s = time%60;
  document.getElementById('timer').innerText = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
},1000);

showQuestion();
